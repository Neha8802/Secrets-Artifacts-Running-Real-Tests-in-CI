name: secrets as env var

on: workflow_dispatch

jobs:
  secrets_as_env_var:
    runs-on: ubuntu-slim
    steps:
      - name: passing the secret as env var
        env:
          my_secret: ${{ secrets.MY_SECRET_MESSAGE }}
        run: |
          if [ -n "$my_secret" ]; then
            echo "if the value is set: true"
          else
            echo "the value is not set"
          fi

      - name: message
        run: echo "the job ran successfully"

name: upload artifacts

on: workflow_dispatch

jobs:
  upload_artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: generates a file a test report or a log file
        run: touch my_file.txt

      - name: upload this
        uses: actions/upload-artifact@v4
        with:
          name: my-bundle
          path: my_file.txt

    

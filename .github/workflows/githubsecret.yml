name: secrets yaml

on: workflow_dispatch

jobs:
  Secrets_Artifacts_Running_Real_Tests:
    runs-on: ubuntu-latest
    steps:
      - name: reading sectret and printing if set or not
        env:
          SECRET_NAME: ${{ secrets.MY_SECRET_MESSAGE }}
        run: |
          if [ -n "$SECRET_NAME" ]; then 
            echo The secret is set: true
          else
            echo "the secret is not set"
          fi

      - name: print the secret name directly
        run: echo  "the secret is ${{ secrets.MY_SECRET_MESSAGE }}"

